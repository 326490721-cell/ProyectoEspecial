<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Metadatos de visualización, título y estilos de la página. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrikSix Arcade - Catalog</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/Login.css">
</head>

<body>
  <!-- Encabezado compartido con navegación y logotipos. -->
  <header class="bar">
    <!-- Botón accesible para abrir y cerrar el menú. -->
    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <!-- Enlaces a las páginas principales del sitio. -->
    <nav class="menu-panel" id="main-menu" aria-label="Menú principal" hidden>
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catalog</a>
      <a href="logIn.html">Log In</a>
    </nav>
    <!-- Identidad institucional y logotipo del local. -->
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="Logo ENP UNAM">
    </div>
    <div class="image-frame image-frame--local">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="Logo FrikSix Arcade">
    </div>
  </header>
  <h1>Catalog of Games</h1>
  <h3>Nintendo Switch 2</h3>
  <section class="carrusel" aria-label="Game consoles" tabindex="0">
    <!-- Cada tarjeta muestra una imagen y el nombre de una consola. -->
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/MarioKard.jpg" alt="Mario Kart 8 Deluxe">
      <figcaption>Mario Kart 8 Deluxe</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/Smash.jpg" alt="Super Smash Bros. Ultimate">
      <figcaption>Super Smash Bros. Ultimate</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/wonder.jpg" alt="Super Mario Wonder">
      <figcaption>Super Mario Wonder</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/OverCook.jpg" alt="Overcooked! All You Can Eat">
      <figcaption>Overcooked! All You Can Eat</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/World.jpg" alt="The Legend of Zelda: Tears of the Kingdom">
      <figcaption>The Legend of Zelda: Tears of the Kingdom</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/Sports.jpeg" alt="Sports Nintendo Switch 2 ">
      <figcaption>Nintendo Switch Sports</figcaption>
    </figure>
  </section>
  <!-- Controla el comportamiento interactivo del menú. -->
  <script src="scripts/Menu.js" defer></script>
</body>

</html>
