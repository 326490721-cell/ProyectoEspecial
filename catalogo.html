<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Page metadata, title, and styles. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrikSix Arcade - Catalog</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/Login.css">
</head>

<body>
  <!-- Shared header with navigation and logos. -->
  <header class="bar">
    <!-- Accessible button to open and close the menu. -->
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <!-- Links to the site's main pages. -->
    <nav class="menu-panel" id="main-menu" aria-label="Main menu" hidden>
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catalog</a>
      <a href="logIn.html">Log In</a>
    </nav>
    <!-- Institutional and arcade logos. -->
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="ENP UNAM logo">
    </div>
    <div class="image-frame image-frame--local">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="FrikSix Arcade logo">
    </div>
  </header>
  <h1>Catalog of Games</h1>
    <h3 class="catalog-subtitle">Explore our game catalog for players of all kinds</h3>
  <h2 class="console-title">Nintendo Switch 2</h2>
  <section class="carrusel" aria-label="Nintendo Switch 2 games" tabindex="0">
    <!-- Each card displays a game image and title. -->
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/MarioKard.jpg" alt="Mario Kart 8 Deluxe">
      <figcaption>Mario Kart 8 Deluxe</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/Smash.jpg" alt="Super Smash Bros. Ultimate">
      <figcaption>Super Smash Bros. Ultimate</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/wonder.jpg" alt="Super Mario Wonder">
      <figcaption>Super Mario Wonder</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/OverCook.jpg" alt="Overcooked! All You Can Eat">
      <figcaption>Overcooked! All You Can Eat</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/World.jpg" alt="The Legend of Zelda: Tears of the Kingdom">
      <figcaption>Mario Kart World</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/Sports.jpeg" alt="Sports Nintendo Switch 2 ">
      <figcaption>Nintendo Switch Sports</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/PokemonU.jpg" alt="Pokémon Unite">
      <figcaption>Pokémon Unite</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/SplatoonR.jpg" alt="Fire Emblem Engage">
      <figcaption>Splatoon Raiders</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/Kirbo.jpg" alt="Fire Emblem Engage">
      <figcaption>Kirbi Air Riders</figcaption>
    </figure>
    <figure class="console-card">
      <img src="assets/Juegos/NintentoSwich2/Nesonline.jpg" alt="Fire Emblem Engage">
      <figcaption>Online Retro</figcaption>
    </figure>
  </section>
  <section aria-labelledby="multigame-title">
    <h2 class="console-title" id="multigame-title">Multigame Arcade</h2>
    <h3 class="catalog-subtitle">Choose from classic arcade, music, and action games</h3>
    <div class="carrusel" role="list" aria-label="Multigame arcade games" tabindex="0">
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/DonkeyK.avif" alt="Donkey Kong" loading="lazy">
        <figcaption>Donkey Kong</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/Galaga.avif" alt="Galaga" loading="lazy">
        <figcaption>Galaga</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/GuitarHero.jpg" alt="Guitar Hero" loading="lazy">
        <figcaption>Guitar Hero</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/Pacman.jpg" alt="Pac-Man" loading="lazy">
        <figcaption>Pac-Man</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/PumpItUp.jpg" alt="Pump It Up" loading="lazy">
        <figcaption>Pump It Up</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/PxG.webp" alt="PxG" loading="lazy">
        <figcaption>PxG</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/Simsons.avif" alt="The Simpsons" loading="lazy">
        <figcaption>The Simpsons</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/Space%20Invaders.jpg" alt="Space Invaders" loading="lazy">
        <figcaption>Space Invaders</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/juego%20de%20careras.jpg" alt="Arcade racing game" loading="lazy">
        <figcaption>Arcade Racing</figcaption>
      </figure>
      <figure class="console-card" role="listitem">
        <img src="assets/Juegos/MaquinaMultijuegos/street-fighter.jpg" alt="Street Fighter" loading="lazy">
        <figcaption>Street Fighter</figcaption>
      </figure>
    </div>
  </section>
  <!-- Controls the menu's interactive behavior. -->
  <script src="scripts/Menu.js" defer></script>
</body>

</html>
