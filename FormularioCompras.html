<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrikSix Arcade - Registro de compras</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/proveedores.css">
</head>

<body>
  <header class="bar">
    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <nav class="menu-panel" id="main-menu" aria-label="Menú principal" hidden>
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="logIn.html">Iniciar sesión</a>
    </nav>
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="Escudos de la UNAM y la ENP">
    </div>
    <div class="image-frame image-frame--local">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="Logotipo de FrikSix Arcade">
    </div>
  </header>

  <main class="contenedor proveedores-card">
    <h1>Registro de compras</h1>
    <p class="proveedores-intro">Completa los datos del producto y la compra. Este formulario solo valida la información en esta página; no guarda ni envía los datos.</p>

    <form class="proveedores-form" id="compras-form">
      <div class="proveedores-fields">
        <div class="proveedores-field">
          <label for="clave-producto">Clave del producto</label>
          <input id="clave-producto" name="clave-producto" type="text" maxlength="30" autocomplete="off" required>
        </div>

        <div class="proveedores-field">
          <label for="nombre-producto">Nombre del producto</label>
          <input id="nombre-producto" name="nombre-producto" type="text" maxlength="150" autocomplete="off" required>
        </div>

        <div class="proveedores-field">
          <label for="clave-proveedor">Clave del proveedor</label>
          <input id="clave-proveedor" name="clave-proveedor" type="text" maxlength="30" autocomplete="off" required>
        </div>

        <div class="proveedores-field">
          <label for="fecha-compra">Fecha de compra</label>
          <input id="fecha-compra" name="fecha-compra" type="date" required>
        </div>

        <div class="proveedores-field">
          <label for="precio-producto">Precio del producto</label>
          <input id="precio-producto" name="precio-producto" type="number" min="0" step="0.01" inputmode="decimal" required>
        </div>

        <div class="proveedores-field">
          <label for="cantidad-solicitar">Cantidad a solicitar</label>
          <input id="cantidad-solicitar" name="cantidad-solicitar" type="number" min="1" step="1" required>
        </div>

        <div class="proveedores-field proveedores-field--wide">
          <label for="total-pagar">Total a pagar</label>
          <input id="total-pagar" name="total-pagar" type="number" min="0" step="0.01" inputmode="decimal" required>
        </div>
      </div>

      <p class="proveedores-message" id="compras-message" role="status" hidden></p>

      <div class="proveedores-actions">
        <button class="proveedores-submit" type="submit">Revisar datos</button>
        <button class="proveedores-reset" type="reset">Limpiar formulario</button>
      </div>
    </form>
    <a href="index.html" class="button proveedores-back"><h2>Volver a la página principal</h2></a>
  </main>

  <script src="scripts/Menu.js" defer></script>
  <script src="scripts/Compras.js" defer></script>
  <script src="scripts/ButtonSound.js" defer></script>
</body>

</html>
