<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Configuración del documento y hoja de estilos compartida. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrikSix Arcade | Proyecto escolar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/contabilidad.css">
</head>

<body>
  <!-- Barra de navegación y logotipos del proyecto. -->
  <header class="bar">
    <!-- El botón controla el menú desplegable y anuncia su estado. -->
    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <!-- Enlaces principales; Menu.js controla cuándo se muestran. -->
    <nav class="menu-panel" id="main-menu" aria-label="Menú principal" hidden>
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="logIn.html">Iniciar sesión</a>
      <a href="Contabilidad.html">Contabilidad</a>
    </nav>
    <!-- Logotipos institucional y del arcade. -->
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="Escudos de la UNAM y la ENP">
    </div>
    <div class="image-frame">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="Logotipo de FrikSix Arcade">
    </div>
  </header>
  <main class="accounting-page">
    <h1>Contabilidad</h1>
    <section class="contenedor accounting-card" aria-labelledby="accounting-title">
      <h2 id="accounting-title">Sistema de contabilidad</h2>
      <p>Selecciona el formulario que deseas consultar o registrar.</p>
      <nav class="accounting-actions" aria-label="Formularios de contabilidad">
        <a class="accounting-action" href="FormularioCompras.html">Registro de compras</a>
        <a class="accounting-action" href="FormularioVentas.html">Registro de ventas</a>
        <a class="accounting-action" href="FormularioPersonal.html">Registro de personal</a>
        <a class="accounting-action" href="FormularioMobiliario.html">Registro de mobiliario</a>
        <a class="accounting-action" href="FormularioEmpresas.html">Registro de empresas</a>
      </nav>
    </section>
  </main>

  <script src="scripts/Menu.js" defer></script>
</body>

</html>
