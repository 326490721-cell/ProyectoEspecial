<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Document metadata, title, and shared and login stylesheets. -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FrikSix Arcade - Log In</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="css/logIn.css">
    </head>
    <body class="login-page">
        <!-- Shared navigation bar. -->
        <header class="bar">
    <!-- Button to open and close the navigation menu. -->
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <!-- Navigation between the main site pages. -->
    <nav class="menu-panel" id="main-menu" aria-label="Main menu" hidden>
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catalog</a>
      <a href="FormularioEmpresas.html">Suppliers</a>
      <a href="logIn.html">Log In</a>
    </nav>
    <!-- Institutional and arcade logos. -->
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="ENP UNAM logo">
    </div>
    <div class="image-frame image-frame--local">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="FrikSix Arcade logo">
    </div>
  </header>
        <!-- Enables menu interactions. -->
        <script src="scripts/Menu.js" defer></script>
  <!-- Card with the login image and form. -->
  <main class="contenedor login-card">
      <img class="nyan-cat" src="assets/NyanCat.gif" alt="Nyan Cat">
    <h2>Log In to Your Account</h2>
      <p class="login-message" id="login-message" role="alert" hidden></p>
    <!-- Required username and password fields. -->
    <form class="login-form" action="scripts/Login.php" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required placeholder="Username123"
               pattern="[A-Za-z0-9]{3,20}" title="Use 3 to 20 letters or numbers."
               autocomplete="username">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required
               placeholder="Enter your password"
               title="Use at least 12 characters and a maximum of 72 bytes."
               autocomplete="current-password">
        <button class="login-submit" type="submit">Log In</button>
      </form>
  </main>
        <!-- Validates the username and password length before submitting to PHP. -->
        <script src="scripts/LogIn.js" defer></script>
        <script src="scripts/ButtonSound.js" defer></script>
    </body>
</html>
