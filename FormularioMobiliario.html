<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrikSix Arcade - Registro de mobiliario</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/proveedores.css">
</head>

<body>
  <header class="bar">
    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <nav class="menu-panel" id="main-menu" aria-label="Menú principal" hidden>
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="FormularioEmpresas.html">Proveedores</a>
      <a href="FormularioCompras.html">Compras</a>
      <a href="FormularioVentas.html">Ventas</a>
      <a href="FormularioPersonal.html">Personal</a>
      <a href="FormularioMobiliario.html" aria-current="page">Mobiliario</a>
      <a href="logIn.html">Iniciar sesión</a>
    </nav>
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="Escudos de la UNAM y la ENP">
    </div>
    <div class="image-frame image-frame--local">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="Logotipo de FrikSix Arcade">
    </div>
  </header>

  <main class="contenedor proveedores-card">
    <h1>Registro de mobiliario</h1>
    <p class="proveedores-intro">Registra mesas, sillas, revistas, libros u otro mobiliario. Este formulario solo valida la información; no guarda ni envía los datos.</p>

    <form class="proveedores-form" id="mobiliario-form">
      <div class="proveedores-fields">
        <div class="proveedores-field">
          <label for="nombre-mobiliario">Nombre del mobiliario</label>
          <input id="nombre-mobiliario" name="nombre-mobiliario" type="text" maxlength="150" required>
        </div>

        <div class="proveedores-field">
          <label for="cantidad-mobiliario">Cantidad</label>
          <input id="cantidad-mobiliario" name="cantidad-mobiliario" type="number" min="1" step="1" required>
        </div>
      </div>

      <p class="proveedores-message" id="mobiliario-message" role="status" hidden></p>

      <div class="proveedores-actions">
        <button class="proveedores-submit" type="submit">Revisar datos</button>
        <button class="proveedores-reset" type="reset">Limpiar formulario</button>
      </div>
    </form>
    <a href="index.html" class="button proveedores-back"><h2>Volver a la página principal</h2></a>
  </main>

  <script src="scripts/Menu.js" defer></script>
  <script src="scripts/Mobiliario.js" defer></script>
  <script src="scripts/ButtonSound.js" defer></script>
</body>

</html>
