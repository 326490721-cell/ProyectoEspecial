<!DOCTYPE html>
<html lang="es">
    <head>
        <!-- Metadatos, título y hojas de estilos generales y de inicio de sesión. -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FrikSix Arcade - Iniciar sesión</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="css/logIn.css">
    </head>
    <body class="login-page">
        <!-- Barra superior compartida con las demás páginas. -->
        <header class="bar">
    <!-- Botón que abre y cierra el menú de navegación. -->
    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <!-- Navegación entre inicio, catálogo e inicio de sesión. -->
    <nav class="menu-panel" id="main-menu" aria-label="Menú principal" hidden>
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="logIn.html">Iniciar sesión</a>
    </nav>
    <!-- Logotipos institucional y del local. -->
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="Logo ENP UNAM">
    </div>
    <div class="image-frame image-frame--local">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="Logo FrikSix Arcade">
    </div>
  </header>
        <!-- Activa las interacciones del menú. -->
        <script src="scripts/Menu.js" defer></script>
  <!-- Tarjeta con imagen y formulario de acceso. -->
  <main class="contenedor login-card">
      <img class="nyan-cat" src="assets/NyanCat.gif" alt="Nyan Cat">
    <h2>Inicia sesión en tu cuenta</h2>
      <p class="login-message" id="login-message" role="alert" hidden></p>
    <!-- Campos requeridos para escribir usuario y contraseña. -->
    <form class="login-form" action="scripts/Login.php" method="post">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required placeholder="Usuario123"
               pattern="[A-Za-z0-9]{3,20}" title="Usa de 3 a 20 letras o números."
               autocomplete="username">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required
               placeholder="Escribe tu contraseña"
               title="Usa al menos 12 caracteres y un máximo de 72 bytes."
               autocomplete="current-password">
        <button class="login-submit" type="submit">Iniciar sesión</button>
      </form>
  </main>s
        <!-- Valida el usuario y la longitud de la contraseña antes de enviar al PHP. -->
        <script src="scripts/LogIn.js" defer></script>
        <script src="scripts/ButtonSound.js" defer></script>
    </body>
</html>
