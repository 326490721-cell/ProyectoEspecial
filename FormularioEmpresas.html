<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrikSix Arcade - Proveedores</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/proveedores.css">
</head>

<body>
  <header class="bar">
    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <nav class="menu-panel" id="main-menu" aria-label="Menú principal" hidden>
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="FormularioEmpresas.html" aria-current="page">Proveedores</a>
      <a href="logIn.html">Iniciar sesión</a>
    </nav>
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="Escudos de la UNAM y la ENP">
    </div>
    <div class="image-frame image-frame--local">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="Logotipo de FrikSix Arcade">
    </div>
  </header>

  <main class="contenedor proveedores-card">
    <h1>Registro de proveedores</h1>
    <p class="proveedores-intro">Completa los datos de contacto del proveedor. Este formulario solo valida la información en esta página; no guarda ni envía los datos.</p>

    <form class="proveedores-form" id="proveedores-form">
      <div class="proveedores-fields">
        <div class="proveedores-field">
          <label for="clave">Clave del proveedor</label>
          <input id="clave" type="text" maxlength="30" autocomplete="off" required>
        </div>

        <div class="proveedores-field">
          <label for="nombre">Nombre del proveedor o razón social</label>
          <input id="nombre" type="text" maxlength="150" autocomplete="organization" required>
        </div>

        <div class="proveedores-field">
          <label for="rfc">RFC del proveedor</label>
          <input id="rfc" type="text" maxlength="13" pattern="[A-Za-zÑñ&]{3,4}[0-9]{6}[A-Za-z0-9]{3}" title="Escribe un RFC válido de 12 o 13 caracteres." autocomplete="off" required>
        </div>

        <div class="proveedores-field">
          <label for="telefono">Teléfono</label>
          <input id="telefono" type="tel" inputmode="tel" maxlength="25" title="Usa solo números y separadores; debe contener de 10 a 15 dígitos." autocomplete="tel" required>
        </div>

        <div class="proveedores-field proveedores-field--wide">
          <label for="direccion">Dirección de la empresa</label>
          <textarea id="direccion" rows="3" maxlength="255" autocomplete="street-address" required></textarea>
        </div>

        <div class="proveedores-field">
          <label for="correo">Correo electrónico</label>
          <input id="correo" type="email" maxlength="254" autocomplete="email" required>
        </div>

        <div class="proveedores-field">
          <label for="contacto">Nombre de la persona de contacto</label>
          <input id="contacto" type="text" maxlength="150" autocomplete="name" required>
        </div>

        <div class="proveedores-field proveedores-field--wide">
          <label for="url">Dirección o URL del proveedor</label>
          <input id="url" type="url" maxlength="2048" placeholder="https://ejemplo.com" autocomplete="url" required>
        </div>
      </div>

      <p class="proveedores-message" id="proveedores-message" role="status" hidden></p>

      <div class="proveedores-actions">
        <button class="proveedores-submit" type="submit">Revisar datos</button>
        <button class="proveedores-reset" type="reset">Limpiar formulario</button>
      </div>
    </form>
  </main>

  <script src="scripts/Menu.js" defer></script>
  <script src="scripts/Proveedores.js" defer></script>
  <script src="scripts/ButtonSound.js" defer></script>
</body>

</html>
