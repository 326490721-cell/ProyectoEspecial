<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrikSix Arcade - Suppliers</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/proveedores.css">
</head>

<body>
  <header class="bar">
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" href="index.html">FrikSix Arcade</a>
    <nav class="menu-panel" id="main-menu" aria-label="Main menu" hidden>
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catalog</a>
      <a href="FormularioEmpresas.html" aria-current="page">Suppliers</a>
      <a href="logIn.html">Log In</a>
    </nav>
    <div class="image-frame">
      <img src="assets/logos/ENP_UNAM.png" alt="ENP UNAM logo">
    </div>
    <div class="image-frame image-frame--local">
      <img src="assets/logos/Friksix Arcade.jpeg" alt="FrikSix Arcade logo">
    </div>
  </header>

  <main class="contenedor proveedores-card">
    <h1>Supplier Registration</h1>
    <p class="proveedores-intro">Enter the supplier's contact information. This form only validates the information on this page; it does not save or submit the data.</p>

    <form class="proveedores-form" id="proveedores-form">
      <div class="proveedores-fields">
        <div class="proveedores-field">
          <label for="clave">Supplier ID</label>
          <input id="clave" type="text" maxlength="30" autocomplete="off" required>
        </div>

        <div class="proveedores-field">
          <label for="nombre">Supplier name or legal business name</label>
          <input id="nombre" type="text" maxlength="150" autocomplete="organization" required>
        </div>

        <div class="proveedores-field">
          <label for="rfc">Supplier tax ID (RFC)</label>
          <input id="rfc" type="text" maxlength="13" pattern="[A-Za-zÑñ&]{3,4}[0-9]{6}[A-Za-z0-9]{3}" title="Enter a valid 12- or 13-character RFC." autocomplete="off" required>
        </div>

        <div class="proveedores-field">
          <label for="telefono">Phone number</label>
          <input id="telefono" type="tel" inputmode="tel" maxlength="25" title="Use only numbers and separators; enter 10 to 15 digits." autocomplete="tel" required>
        </div>

        <div class="proveedores-field proveedores-field--wide">
          <label for="direccion">Business address</label>
          <textarea id="direccion" rows="3" maxlength="255" autocomplete="street-address" required></textarea>
        </div>

        <div class="proveedores-field">
          <label for="correo">Email address</label>
          <input id="correo" type="email" maxlength="254" autocomplete="email" required>
        </div>

        <div class="proveedores-field">
          <label for="contacto">Contact person's name</label>
          <input id="contacto" type="text" maxlength="150" autocomplete="name" required>
        </div>

        <div class="proveedores-field proveedores-field--wide">
          <label for="url">Supplier website or URL</label>
          <input id="url" type="url" maxlength="2048" placeholder="https://example.com" autocomplete="url" required>
        </div>
      </div>

      <p class="proveedores-message" id="proveedores-message" role="status" hidden></p>

      <div class="proveedores-actions">
        <button class="proveedores-submit" type="submit">Review information</button>
        <button class="proveedores-reset" type="reset">Clear form</button>
      </div>
    </form>
  </main>

  <script src="scripts/Menu.js" defer></script>
  <script src="scripts/Proveedores.js" defer></script>
  <script src="scripts/ButtonSound.js" defer></script>
</body>

</html>
